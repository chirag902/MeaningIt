name: Health check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  deep-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check app and model availability
        env:
          APP_URL: ${{ secrets.APP_URL }}
          HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$HEALTHCHECK_SECRET" ]; then
            echo "::error::Set the APP_URL and HEALTHCHECK_SECRET repository secrets first."
            exit 1
          fi

          curl -fsS --max-time 30 \
            -H "x-health-secret: $HEALTHCHECK_SECRET" \
            "$APP_URL/api/health?deep=1"